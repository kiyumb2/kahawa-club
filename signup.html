<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kahawa Club - Sign Up</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 32px 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
  .header { text-align: center; margin-bottom: 24px; }
  .title { font-size: 26px; font-weight: 900; color: #111; margin-bottom: 6px; }
  .title span { color: #C49A6C; }
  .subtitle { font-size: 13px; color: #666; }
  .lbl { display: block; font-size: 11px; font-weight: 700; color: #7A5C45; letter-spacing: 1px; text-transform: uppercase; margin: 14px 0 6px; }
  .inp { width: 100%; padding: 12px; background: #F5EDE3; border: 1.5px solid rgba(111,78,55,0.2); border-radius: 10px; font-size: 14px; outline: none; color: #333; }
  .inp:focus { border-color: #C49A6C; background: white; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .btn { width: 100%; padding: 14px; background: #6F4E37; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 20px; }
  .btn:hover { background: #5a3d2c; }
  .footer-text { text-align: center; margin-top: 14px; font-size: 13px; color: #7A5C45; }
  .footer-text a { color: #6F4E37; font-weight: bold; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">Kahawa <span>Club</span></div>
    <div class="subtitle">Join Ethiopia's most rewarding coffee experience</div>
  </div>
  
  <form action="/api/process_signup.php" method="POST">
    <div class="row">
      <div>
        <label for="first_name" class="lbl">First Name</label>
        <input id="first_name" class="inp" type="text" name="first_name" placeholder="First name" required autocomplete="given-name">
      </div>
      <div>
        <label for="last_name" class="lbl">Last Name</label>
        <input id="last_name" class="inp" type="text" name="last_name" placeholder="Last name" required autocomplete="family-name">
      </div>
    </div>
    
    <label for="phone_number" class="lbl">Phone Number</label>
    <input id="phone_number" class="inp" type="tel" name="phone_number" placeholder="0912345678" required autocomplete="tel">
    
    <label for="birthday" class="lbl">Birthday (get 100 bonus points!)</label>
    <input id="birthday" class="inp" type="date" name="birthday">
    
    <label for="password" class="lbl">Password</label>
    <input id="password" class="inp" type="password" name="password" placeholder="Create a password" required autocomplete="new-password">
    
    <button type="submit" class="btn">Join Kahawa Club</button>
    
    <div class="footer-text">
      Already a member? <a href="/index.html">Sign In</a>
    </div>
  </form>
</div>
</body>
</html>
