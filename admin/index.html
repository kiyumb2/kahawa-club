<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kahawa Coffee Club - Admin Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .login-card { background: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
  .badge { display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; background: #1b4332; border: 1px solid #c49a6c; border-radius: 50%; font-size: 22px; margin-bottom: 12px; }
  h1 { font-size: 18px; color: #fff; letter-spacing: 1px; font-weight: 900; }
  p { font-size: 12px; color: #c49a6c; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; }
  .form-group { text-align: left; margin-bottom: 16px; }
  label { font-size: 11px; color: #aaa; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
  input:focus { border-color: #c49a6c; }
  .btn-submit { width: 100%; padding: 12px; background: #6f4e37; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
  .btn-submit:hover { background: #5a3d2c; }
  .error-msg { background: rgba(183, 9, 76, 0.2); border: 1px solid #b7094c; color: #ff8fa3; font-size: 12px; padding: 10px; border-radius: 8px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>

<div class="login-card">
  <div class="badge">☕</div>
  <h1>KAHAWA</h1>
  <p>Admin Portal</p>

  <div id="error-box" class="error-msg"></div>

  <form id="adminLoginForm">
    <div class="form-group">
      <label for="phone_number">Admin Phone Number</label>
      <input type="text" id="phone_number" name="phone_number" required placeholder="0911002233">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn-submit">Sign In to Dashboard</button>
  </form>
</div>

<script>
document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const errorBox = document.getElementById('error-box');
  errorBox.style.display = 'none';

  fetch('/api/admin_login.php', {
    method: 'POST',
    body: new URLSearchParams(new FormData(this))
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      window.location.href = '/admin/dashboard.php';
    } else {
      errorBox.innerText = data.message || 'Invalid credentials';
      errorBox.style.display = 'block';
    }
  })
  .catch(() => {
    errorBox.innerText = 'Server error. Please try again.';
    errorBox.style.display = 'block';
  });
});
</script>
</body>
</html>
